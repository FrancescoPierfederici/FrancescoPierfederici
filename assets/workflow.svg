<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-label="How I work: design, build, test, ship">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d14"/>
      <stop offset="1" stop-color="#14112a"/>
    </linearGradient>
    <linearGradient id="track" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".33" stop-color="#58a6ff"/>
      <stop offset=".66" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#ffb84d"/>
    </linearGradient>
    <radialGradient id="glow" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .title{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:4px;fill:#8b949e}
    .lbl{font:700 20px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f0f6fc}
    .sub{font:400 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}
    .node{fill:#0d1117;stroke-width:2}
    .halo{opacity:.12;transform-box:fill-box;transform-origin:center;animation:lit 8s ease-in-out infinite}
    .n2{animation-delay:2.67s}.n3{animation-delay:5.33s}.n4{animation-delay:7.75s}
    @keyframes lit{0%,100%{opacity:.12;transform:scale(1)}6%{opacity:.55;transform:scale(1.25)}20%{opacity:.12;transform:scale(1)}}
    .flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-16}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

  <rect width="1200" height="230" rx="22" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="229" rx="22" fill="none" stroke="#30363d"/>
  <text class="title" x="60" y="48">HOW I WORK</text>

  <!-- track -->
  <line x1="150" y1="112" x2="1050" y2="112" stroke="#30363d" stroke-width="2"/>
  <line class="flow" x1="150" y1="112" x2="1050" y2="112" stroke="url(#track)" stroke-width="2"/>

  <!-- travelling light -->
  <circle r="16" fill="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M150 112H1050" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.9;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- nodes -->
  <g>
    <circle class="halo" cx="150" cy="112" r="30" fill="#a78bfa"/>
    <circle class="node" cx="150" cy="112" r="20" stroke="#a78bfa"/>
    <circle cx="150" cy="112" r="6" fill="#a78bfa"/>
    <text class="lbl" x="150" y="168" text-anchor="middle">Design</text>
    <text class="sub" x="150" y="192" text-anchor="middle">Figma · UX/UI</text>
  </g>
  <g>
    <circle class="halo n2" cx="450" cy="112" r="30" fill="#58a6ff"/>
    <circle class="node" cx="450" cy="112" r="20" stroke="#58a6ff"/>
    <circle cx="450" cy="112" r="6" fill="#58a6ff"/>
    <text class="lbl" x="450" y="168" text-anchor="middle">Build</text>
    <text class="sub" x="450" y="192" text-anchor="middle">React · TypeScript · Three.js</text>
  </g>
  <g>
    <circle class="halo n3" cx="750" cy="112" r="30" fill="#7ee787"/>
    <circle class="node" cx="750" cy="112" r="20" stroke="#7ee787"/>
    <circle cx="750" cy="112" r="6" fill="#7ee787"/>
    <text class="lbl" x="750" y="168" text-anchor="middle">Test</text>
    <text class="sub" x="750" y="192" text-anchor="middle">A QA mindset, from Samsung</text>
  </g>
  <g>
    <circle class="halo n4" cx="1050" cy="112" r="30" fill="#ffb84d"/>
    <circle class="node" cx="1050" cy="112" r="20" stroke="#ffb84d"/>
    <circle cx="1050" cy="112" r="6" fill="#ffb84d"/>
    <text class="lbl" x="1050" y="168" text-anchor="middle">Ship</text>
    <text class="sub" x="1050" y="192" text-anchor="middle">Vercel · GitHub Pages</text>
  </g>
</svg>
